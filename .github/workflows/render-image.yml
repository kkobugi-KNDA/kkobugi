name: Render image (512 MB)

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.sh
      - render.yaml
      - backend/**
      - frontend/**
      - .github/workflows/render-image.yml
      - .github/scripts/render_capacity.py

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      IMAGE_TAG: kkobugi-render-ci:${{ github.sha }}
      CONTAINER_NAME: kkobugi-render-smoke
      CAPACITY_ARTIFACTS: capacity-results

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --pull --progress=plain --tag "$IMAGE_TAG" .

      - name: Start with 512 MB, no extra swap and 0.5 CPU
        run: |
          docker run --detach --name "$CONTAINER_NAME" \
            --memory=512m --memory-swap=512m \
            --cpus=0.5 \
            --publish 127.0.0.1:10000:10000 \
            --env PORT=10000 \
            --env 'KKOBUGI_TRUSTED_ORIGINS=["https://capacity.kkobugi.local"]' \
            "$IMAGE_TAG"
          test "$(docker inspect --format '{{.HostConfig.Memory}}' "$CONTAINER_NAME")" = 536870912
          test "$(docker inspect --format '{{.HostConfig.MemorySwap}}' "$CONTAINER_NAME")" = 536870912
          test "$(docker inspect --format '{{.HostConfig.NanoCpus}}' "$CONTAINER_NAME")" = 500000000

      - name: Check health and routes
        run: |
          ready=false
          for attempt in {1..60}; do
            if [ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" != true ]; then
              echo 'Container stopped before becoming ready.' >&2
              exit 1
            fi
            status=$(curl --silent --connect-timeout 1 --max-time 2 \
              --output /tmp/kkobugi-health.json --write-out '%{http_code}' \
              http://127.0.0.1:10000/api/v1/health || true)
            if [ "$status" = 200 ]; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true

          status=$(curl --silent --show-error --max-time 5 \
            --output /tmp/kkobugi-models.html --write-out '%{http_code}' \
            http://127.0.0.1:10000/models)
          test "$status" = 200
          grep --ignore-case --quiet '<!doctype html' /tmp/kkobugi-models.html

          status=$(curl --silent --show-error --max-time 5 \
            --output /tmp/kkobugi-missing-api.json --write-out '%{http_code}' \
            http://127.0.0.1:10000/api/v1/does-not-exist)
          test "$status" = 404
          test "$(docker inspect --format '{{.State.OOMKilled}}' "$CONTAINER_NAME")" = false

      - name: Prepare capacity runner
        run: |
          python3 -m venv "$RUNNER_TEMP/kkobugi-capacity-venv"
          "$RUNNER_TEMP/kkobugi-capacity-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: pandas==3.1.1 httpx==0.28.1

      - name: Full public dataset capacity
        timeout-minutes: 18
        run: |
          "$RUNNER_TEMP/kkobugi-capacity-venv/bin/python" .github/scripts/render_capacity.py \
            --container "$CONTAINER_NAME" --report-dir "$CAPACITY_ARTIFACTS"

      - name: Container logs and memory
        if: always()
        run: |
          mkdir -p "$CAPACITY_ARTIFACTS"
          if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            docker logs --tail 500 "$CONTAINER_NAME" > "$CAPACITY_ARTIFACTS/container.log" 2>&1
            cat "$CAPACITY_ARTIFACTS/container.log"
            docker inspect --format 'running={{.State.Running}} oomKilled={{.State.OOMKilled}} exitCode={{.State.ExitCode}}' "$CONTAINER_NAME"
            docker stats --no-stream --format 'memory={{.MemUsage}}' "$CONTAINER_NAME" || true
          else
            echo 'Container was not created.' > "$CAPACITY_ARTIFACTS/container.log"
          fi

      - name: Save capacity summary and log only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-capacity-${{ github.run_id }}
          path: |
            ${{ env.CAPACITY_ARTIFACTS }}/report.json
            ${{ env.CAPACITY_ARTIFACTS }}/container.log
          if-no-files-found: warn
          retention-days: 3

      - name: Cleanup
        if: always()
        run: |
          docker rm --force "$CONTAINER_NAME" >/dev/null 2>&1 || true
          docker image rm "$IMAGE_TAG" >/dev/null 2>&1 || true
