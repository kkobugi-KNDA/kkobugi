[project]
name = "kkobugi-backend"
version = "0.1.0"
description = "꼬부기 펌프 분석·점검 보고서 API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "joblib>=1.4,<2",
    "lightgbm>=4.6,<5",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.20,<1",
    "pwdlib[argon2]>=0.2,<1",
    "sqlalchemy>=2.0,<2.1",
    "scikit-learn==1.9.1",
    "threadpoolctl>=3.5,<4",
    "uvicorn>=0.30,<1",
    "xgboost>=3,<4",
    "httpx>=0.27,<1",
    "python-docx>=1,<2",
    "reportlab>=4,<5",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
